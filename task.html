<!doctype html>
<html>
  <head>
    <title>User Data</title>

    <style>
      body {
        font-family: Arial;
        padding: 20px;
        background-color: #f2f2f2;
      }

      button {
        padding: 10px 20px;
        background-color: blue;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: darkblue;
      }

      #status {
        margin-top: 20px;
        font-size: 20px;
        color: green;
      }

      .card {
        background: white;
        padding: 15px;
        margin-top: 10px;
        border-radius: 10px;
        box-shadow: 0px 0px 5px gray;
      }
    </style>
  </head>

  <body>
    <button onclick="loadData()">Fetch Users</button>

    <h2 id="status"></h2>

    <div id="result"></div>

    <script>
      function loadData() {
        document.getElementById("status").innerHTML = "Loading...";

        setTimeout(() => {
          fetch("https://jsonplaceholder.typicode.com/users")
            .then((response) => response.json())
            .then((data) => {
              let output = "";

              data.forEach((user) => {
                output += `
                                <div class="card">
                                    <h3>${user.name}</h3>
                                    <p>Email: ${user.email}</p>
                                    <p>Phone: ${user.phone}</p>
                                </div>
                            `;
              });

              document.getElementById("result").innerHTML = output;

              document.getElementById("status").innerHTML =
                "Loaded successfully";
            });
        }, 2000);
      }
    </script>
  </body>
</html>
